<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="jquery.js"></script>
    <title>Ejercicio 5</title>
</head>
<body>

    <style>
        .cuadrado{
            background: red;
            height: 120px;
            width: 120px;
            position: absolute;
        }
    </style>

    <input type="button" id="btnanimation" value="Animacion">
    <div class="cuadrado"></div>
    
    <script>
        $(function(){
            $("#btnanimation").click(function(){
                $(".cuadrado").animate({height:'400px', opacity:'0.4'}, "slow");
                $(".cuadrado").animate({height:'300px', opacity:'0.8'}, "slow");
                $(".cuadrado").animate({height:'40px', opacity:'0.4'}, "slow");
                $(".cuadrado").animate({height:'120px', opacity:'1'}, "slow");
            });
        });
    </script>
</body>
</html>
